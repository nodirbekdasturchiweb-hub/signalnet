name: SignalNet Android APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Kodlarni yuklab olish
        uses: actions/checkout@v4

      - name: 2. Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Android SDK sozlash
        uses: android-actions/setup-android@v3

      - name: 4. Gradle 8.6 o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 5. Komandir va Askar APK ilovalarini yig'ish
        run: |
          KOMANDIR_DIR=$(find . -type d -name "3-android-komandir-apk" | head -n 1)
          ASKAR_DIR=$(find . -type d -name "4-android-askar-apk" | head -n 1)

          echo "Found Komandir dir: $KOMANDIR_DIR"
          echo "Found Askar dir: $ASKAR_DIR"

          cd "$KOMANDIR_DIR"
          printf "android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SignalNet-Komandir.apk"

          cd "$GITHUB_WORKSPACE/$ASKAR_DIR"
          printf "android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SignalNet-Askar.apk"

      - name: 6. Tayyor APK fayllarni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: SignalNet-Tayyor-APK-Fayllar
          path: |
            SignalNet-Komandir.apk
            SignalNet-Askar.apk
