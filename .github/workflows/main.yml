name: SignalNet Android APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Kodlarni yuklab olish
        uses: actions/checkout@v4

      - name: 2. Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Android SDK sozlash
        uses: android-actions/setup-android@v3

      - name: 4. Gradle 8.6 o'rnatish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 5. Komandir APK ilovasini yig'ish
        working-directory: ./3-android-komandir-apk
        run: |
          printf "android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SignalNet-Komandir.apk

      - name: 6. Askar APK ilovasini yig'ish
        working-directory: ./4-android-askar-apk
        run: |
          printf "android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SignalNet-Askar.apk

      - name: 7. Tayyor APK fayllarni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: SignalNet-Tayyor-APK-Fayllar
          path: |
            SignalNet-Komandir.apk
            SignalNet-Askar.apk
